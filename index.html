<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIAC Trailing Edge 調光器動畫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Circuit Section */
        .circuit-section {
            background: #0f0f23;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .section-title {
            color: #00d4ff;
            font-size: 14px;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 3px solid #00d4ff;
        }

        /* Control Section */
        .control-section {
            background: #1a1a3e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider-label {
            color: #aaa;
            font-size: 14px;
            white-space: nowrap;
        }

        #dimmingSlider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #333, #00d4ff);
            border-radius: 4px;
            cursor: pointer;
        }

        #dimmingSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .dimming-value {
            background: #0f0f23;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
            min-width: 100px;
            text-align: center;
        }

        /* Oscilloscope Section */
        .scope-section {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #333;
        }

        .scope-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .scope-title {
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
        }

        .channel-legend {
            display: flex;
            gap: 20px;
            font-size: 12px;
            font-family: monospace;
        }

        .channel {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .channel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .ch1 .channel-dot { background: #ffff00; }
        .ch2 .channel-dot { background: #00ff00; }
        .ch3 .channel-dot { background: #00bfff; }

        /* Status indicators */
        .status-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
            padding: 10px;
            background: #0f0f23;
            border-radius: 8px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            transition: background 0.1s;
        }

        .mos-upper-indicator { background: #666; }
        .mos-lower-indicator { background: #666; }
        .mos-upper-indicator.on { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .mos-lower-indicator.on { background: #00ff00; box-shadow: 0 0 8px #00ff00; }

        /* Current flow animation */
        @keyframes flowForward {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes flowBackward {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 24; }
        }

        .current-flow {
            stroke-dasharray: 10, 6;
            stroke-width: 3;
            fill: none;
            stroke: #00bfff;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .current-flow.active {
            opacity: 1;
        }

        .current-flow.flow-forward {
            animation: flowForward 0.8s linear infinite;
        }

        .current-flow.flow-backward {
            animation: flowBackward 0.8s linear infinite;
        }

        /* MOS styling */
        .mos-body {
            transition: fill 0.15s;
        }

        .mos-on .mos-body {
            fill: #00cc00;
        }

        .mos-off .mos-body {
            fill: #555;
        }

        /* LED glow effect */
        .led-glow {
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>
    <h1>TRIAC Trailing Edge 調光器</h1>

    <div class="container">
        <!-- Circuit Diagram Section -->
        <div class="circuit-section">
            <div class="section-title">電路圖 - AC → 上橋(Q1) → 下橋(Q2) → LED → 回到AC (串聯)</div>
            <svg id="circuitSvg" viewBox="0 0 800 220" width="100%" height="220">
                <defs>
                    <!-- Arrow marker for current flow -->
                    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
                        <path d="M0,0 L0,6 L8,3 z" fill="#00bfff"/>
                    </marker>

                    <!-- Glow filter for LED -->
                    <filter id="ledGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Background grid -->
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a3e" stroke-width="0.5"/>
                </pattern>
                <rect width="800" height="220" fill="url(#grid)"/>

                <!-- ====== SERIES CIRCUIT: AC → Q1 → Q2 → LED → AC ====== -->

                <!-- AC Source (左側) -->
                <g transform="translate(30, 60)">
                    <circle cx="35" cy="50" r="30" fill="none" stroke="#ffaa00" stroke-width="2"/>
                    <text x="35" y="45" text-anchor="middle" fill="#ffaa00" font-size="12" font-weight="bold">AC</text>
                    <path d="M22,55 Q28,42 35,55 Q42,68 48,55" fill="none" stroke="#ffaa00" stroke-width="2"/>
                    <text x="35" y="100" text-anchor="middle" fill="#888" font-size="10">110V</text>
                    <!-- AC+ terminal -->
                    <circle cx="65" cy="35" r="3" fill="#ffaa00"/>
                    <text x="75" y="38" fill="#ffaa00" font-size="9">L</text>
                    <!-- AC- terminal -->
                    <circle cx="65" cy="65" r="3" fill="#888"/>
                    <text x="75" y="68" fill="#888" font-size="9">N</text>
                </g>

                <!-- Connection: AC to Q1 -->
                <line x1="98" y1="95" x2="140" y2="95" stroke="#666" stroke-width="2"/>

                <!-- Upper MOS (Q1) - 上橋 -->
                <g id="mosUpper" class="mos-off" transform="translate(140, 65)">
                    <rect class="mos-body" x="0" y="0" width="70" height="60" rx="5" stroke="#888" stroke-width="2"/>
                    <text x="35" y="28" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Q1</text>
                    <text x="35" y="45" text-anchor="middle" fill="#fff" font-size="11">上橋</text>
                    <!-- Gate indicator -->
                    <rect x="5" y="50" width="12" height="6" rx="1" fill="#00ff00" opacity="0.5"/>
                    <text x="11" y="56" text-anchor="middle" fill="#00ff00" font-size="7">G</text>
                </g>

                <!-- Connection: Q1 to Q2 -->
                <line x1="210" y1="95" x2="280" y2="95" stroke="#666" stroke-width="2"/>

                <!-- Connection node between Q1 and Q2 -->
                <circle cx="245" cy="95" r="4" fill="#00d4ff"/>

                <!-- Lower MOS (Q2) - 下橋 -->
                <g id="mosLower" class="mos-off" transform="translate(280, 65)">
                    <rect class="mos-body" x="0" y="0" width="70" height="60" rx="5" stroke="#888" stroke-width="2"/>
                    <text x="35" y="28" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Q2</text>
                    <text x="35" y="45" text-anchor="middle" fill="#fff" font-size="11">下橋</text>
                    <!-- Gate indicator -->
                    <rect x="5" y="50" width="12" height="6" rx="1" fill="#00bfff" opacity="0.5"/>
                    <text x="11" y="56" text-anchor="middle" fill="#00bfff" font-size="7">G</text>
                </g>

                <!-- Connection: Q2 to LED -->
                <line x1="350" y1="95" x2="420" y2="95" stroke="#666" stroke-width="2"/>

                <!-- LED Symbol -->
                <g id="ledGroup" transform="translate(420, 65)">
                    <!-- LED body -->
                    <polygon points="0,30 35,10 35,50" fill="none" stroke="#ff6b6b" stroke-width="2"/>
                    <line x1="35" y1="10" x2="35" y2="50" stroke="#ff6b6b" stroke-width="2"/>
                    <!-- Light rays (will glow when on) -->
                    <g id="ledRays" class="led-glow" opacity="0.3">
                        <line x1="42" y1="15" x2="55" y2="5" stroke="#ff6b6b" stroke-width="2"/>
                        <line x1="42" y1="25" x2="58" y2="18" stroke="#ff6b6b" stroke-width="2"/>
                        <polygon points="55,5 50,12 53,3" fill="#ff6b6b"/>
                        <polygon points="58,18 52,22 55,13" fill="#ff6b6b"/>
                    </g>
                    <!-- Glow effect when LED is on -->
                    <circle id="ledGlowCircle" cx="20" cy="30" r="25" fill="#ff6b6b" opacity="0" filter="url(#ledGlow)"/>
                    <text x="17" y="75" text-anchor="middle" fill="#ff6b6b" font-size="12">LED</text>
                </g>

                <!-- Connection: LED to return (下方迴路) -->
                <line x1="455" y1="95" x2="500" y2="95" stroke="#666" stroke-width="2"/>
                <line x1="500" y1="95" x2="500" y2="180" stroke="#666" stroke-width="2"/>
                <line x1="500" y1="180" x2="65" y2="180" stroke="#666" stroke-width="2"/>
                <line x1="65" y1="180" x2="65" y2="125" stroke="#666" stroke-width="2"/>

                <!-- Return to AC N terminal -->
                <line x1="65" y1="125" x2="95" y2="125" stroke="#666" stroke-width="2"/>
                <line x1="95" y1="125" x2="95" y2="125" stroke="#666" stroke-width="2"/>

                <!-- ====== CURRENT FLOW PATHS ====== -->

                <!-- Positive half cycle current (順時針: AC→Q1→Q2→LED→回AC) -->
                <g id="currentPositive" class="current-flow">
                    <path d="M100,95 L135,95" marker-end="url(#arrowBlue)"/>
                    <path d="M215,95 L275,95" marker-end="url(#arrowBlue)"/>
                    <path d="M355,95 L415,95" marker-end="url(#arrowBlue)"/>
                    <path d="M460,95 L495,95" marker-end="url(#arrowBlue)"/>
                    <path d="M500,100 L500,175" marker-end="url(#arrowBlue)"/>
                    <path d="M495,180 L70,180" marker-end="url(#arrowBlue)"/>
                    <path d="M65,175 L65,130" marker-end="url(#arrowBlue)"/>
                </g>

                <!-- Negative half cycle current (逆時針: AC←Q1←Q2←LED←回AC) -->
                <g id="currentNegative" class="current-flow">
                    <path d="M65,130 L65,175" marker-end="url(#arrowBlue)"/>
                    <path d="M70,180 L495,180" marker-end="url(#arrowBlue)"/>
                    <path d="M500,175 L500,100" marker-end="url(#arrowBlue)"/>
                    <path d="M495,95 L460,95" marker-end="url(#arrowBlue)"/>
                    <path d="M415,95 L355,95" marker-end="url(#arrowBlue)"/>
                    <path d="M275,95 L215,95" marker-end="url(#arrowBlue)"/>
                    <path d="M135,95 L100,95" marker-end="url(#arrowBlue)"/>
                </g>

                <!-- ====== INFO PANELS ====== -->

                <!-- Dead Time indicator -->
                <g id="deadTimeIndicator" transform="translate(550, 20)" opacity="0">
                    <rect x="0" y="0" width="100" height="40" rx="5" fill="#ff4444" fill-opacity="0.3" stroke="#ff4444" stroke-width="1"/>
                    <text x="50" y="18" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="bold">DEAD TIME</text>
                    <text x="50" y="32" text-anchor="middle" fill="#ff8888" font-size="9">兩橋皆 OFF</text>
                </g>

                <!-- Phase indicator -->
                <g transform="translate(550, 70)">
                    <rect x="0" y="0" width="100" height="55" rx="5" fill="#1a1a3e" stroke="#333" stroke-width="1"/>
                    <text x="50" y="18" text-anchor="middle" fill="#888" font-size="10">當前狀態</text>
                    <text id="phaseText" x="50" y="38" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="bold">--</text>
                    <text id="angleText" x="50" y="50" text-anchor="middle" fill="#ffaa00" font-size="10">導通角: 0°</text>
                </g>

                <!-- Circuit flow label -->
                <g transform="translate(550, 140)">
                    <rect x="0" y="0" width="100" height="60" rx="5" fill="#1a1a3e" stroke="#333" stroke-width="1"/>
                    <text x="50" y="15" text-anchor="middle" fill="#666" font-size="9">電流路徑</text>
                    <text x="50" y="30" text-anchor="middle" fill="#aaa" font-size="9">AC → Q1 → Q2</text>
                    <text x="50" y="43" text-anchor="middle" fill="#aaa" font-size="9">→ LED → AC</text>
                    <text x="50" y="56" text-anchor="middle" fill="#666" font-size="8">(串聯迴路)</text>
                </g>
            </svg>
        </div>

        <!-- Control Section -->
        <div class="control-section">
            <div class="slider-container">
                <span class="slider-label">調光控制 (Trailing Edge)</span>
                <input type="range" id="dimmingSlider" min="0" max="100" value="50">
            </div>
            <div class="dimming-value"><span id="dimmingValue">50</span>%</div>
        </div>

        <!-- Status Panel -->
        <div class="status-panel">
            <div class="status-item">
                <div class="status-indicator mos-upper-indicator" id="upperStatus"></div>
                <span>上橋 Q1</span>
            </div>
            <div class="status-item">
                <div class="status-indicator mos-lower-indicator" id="lowerStatus"></div>
                <span>下橋 Q2</span>
            </div>
            <div class="status-item" style="color: #ff4444;">
                <span id="deadTimeStatus" style="opacity: 0.3;">● Dead Time</span>
            </div>
        </div>

        <!-- Oscilloscope Section (2 cycles) -->
        <div class="scope-section">
            <div class="scope-header">
                <div class="scope-title">▶ OSCILLOSCOPE - 示波器 (2個週期)</div>
                <div class="channel-legend">
                    <div class="channel ch1"><div class="channel-dot"></div>CH1: AC</div>
                    <div class="channel ch2"><div class="channel-dot"></div>CH2: Q1 Gate</div>
                    <div class="channel ch3"><div class="channel-dot"></div>CH3: Q2 Gate</div>
                </div>
            </div>
            <svg id="scopeSvg" viewBox="0 0 800 250" width="100%" height="250">
                <!-- Scope background -->
                <rect width="800" height="250" fill="#0a0a0a"/>

                <!-- Grid -->
                <defs>
                    <pattern id="scopeGrid" width="43.75" height="50" patternUnits="userSpaceOnUse">
                        <path d="M 43.75 0 L 0 0 0 50" fill="none" stroke="#1a3a1a" stroke-width="0.5"/>
                    </pattern>
                    <pattern id="scopeGridMinor" width="8.75" height="10" patternUnits="userSpaceOnUse">
                        <path d="M 8.75 0 L 0 0 0 10" fill="none" stroke="#0d1f0d" stroke-width="0.3"/>
                    </pattern>
                </defs>
                <rect x="50" y="10" width="700" height="230" fill="url(#scopeGridMinor)"/>
                <rect x="50" y="10" width="700" height="230" fill="url(#scopeGrid)"/>

                <!-- Scope border -->
                <rect x="50" y="10" width="700" height="230" fill="none" stroke="#2a4a2a" stroke-width="2"/>

                <!-- Horizontal reference lines -->
                <line x1="50" y1="70" x2="750" y2="70" stroke="#2a4a2a" stroke-width="1" stroke-dasharray="5,5"/>
                <line x1="50" y1="125" x2="750" y2="125" stroke="#2a4a2a" stroke-width="1"/>
                <line x1="50" y1="165" x2="750" y2="165" stroke="#2a4a2a" stroke-width="1" stroke-dasharray="5,5"/>
                <line x1="50" y1="200" x2="750" y2="200" stroke="#2a4a2a" stroke-width="1" stroke-dasharray="5,5"/>

                <!-- Vertical center line (between 2 cycles) -->
                <line x1="400" y1="10" x2="400" y2="240" stroke="#2a4a2a" stroke-width="1" stroke-dasharray="3,3"/>

                <!-- Y-axis labels -->
                <text x="45" y="75" text-anchor="end" fill="#ffff00" font-size="10">CH1</text>
                <text x="45" y="170" text-anchor="end" fill="#00ff00" font-size="10">CH2</text>
                <text x="45" y="205" text-anchor="end" fill="#00bfff" font-size="10">CH3</text>

                <!-- Time markers (2 cycles = 720°) -->
                <text x="50" y="248" fill="#666" font-size="9">0°</text>
                <text x="137" y="248" fill="#666" font-size="9">90°</text>
                <text x="225" y="248" fill="#666" font-size="9">180°</text>
                <text x="312" y="248" fill="#666" font-size="9">270°</text>
                <text x="393" y="248" fill="#666" font-size="9">360°</text>
                <text x="487" y="248" fill="#666" font-size="9">450°</text>
                <text x="575" y="248" fill="#666" font-size="9">540°</text>
                <text x="662" y="248" fill="#666" font-size="9">630°</text>
                <text x="740" y="248" fill="#666" font-size="9">720°</text>

                <!-- Cycle labels -->
                <text x="225" y="22" fill="#444" font-size="10" text-anchor="middle">第一週期</text>
                <text x="575" y="22" fill="#444" font-size="10" text-anchor="middle">第二週期</text>

                <!-- AC Sine wave (CH1 - Yellow) - 2 cycles -->
                <path id="acWave" d="" fill="none" stroke="#ffff00" stroke-width="2"/>

                <!-- Upper gate signal (CH2 - Green) - 2 cycles -->
                <path id="upperGate" d="" fill="none" stroke="#00ff00" stroke-width="2"/>

                <!-- Lower gate signal (CH3 - Blue) - 2 cycles -->
                <path id="lowerGate" d="" fill="none" stroke="#00bfff" stroke-width="2"/>

                <!-- Time indicator (red vertical line) -->
                <line id="timeIndicator" x1="50" y1="10" x2="50" y2="240" stroke="#ff0000" stroke-width="2" opacity="0.8"/>

                <!-- Dead time markers -->
                <g id="deadTimeMarkers"></g>
            </svg>
        </div>
    </div>

    <script>
        // Configuration
        const config = {
            scopeWidth: 700,
            scopeStartX: 50,
            scopeEndX: 750,
            acCenterY: 70,
            acAmplitude: 40,
            upperGateY: 165,
            lowerGateY: 200,
            gateAmplitude: 18,
            deadTimeDegrees: 5,
            totalDegrees: 720, // 2 cycles
            animationSpeed: 5000 // ms for one full cycle (slower)
        };

        // State
        let dimmingPercent = 50;
        let animationPhase = 0;
        let animationId = null;
        let lastTimestamp = 0;

        // DOM Elements
        const dimmingSlider = document.getElementById('dimmingSlider');
        const dimmingValueDisplay = document.getElementById('dimmingValue');
        const mosUpper = document.getElementById('mosUpper');
        const mosLower = document.getElementById('mosLower');
        const currentPositive = document.getElementById('currentPositive');
        const currentNegative = document.getElementById('currentNegative');
        const upperStatus = document.getElementById('upperStatus');
        const lowerStatus = document.getElementById('lowerStatus');
        const deadTimeStatus = document.getElementById('deadTimeStatus');
        const deadTimeIndicator = document.getElementById('deadTimeIndicator');
        const phaseText = document.getElementById('phaseText');
        const angleText = document.getElementById('angleText');
        const timeIndicator = document.getElementById('timeIndicator');
        const acWave = document.getElementById('acWave');
        const upperGate = document.getElementById('upperGate');
        const lowerGate = document.getElementById('lowerGate');
        const deadTimeMarkers = document.getElementById('deadTimeMarkers');
        const ledRays = document.getElementById('ledRays');
        const ledGlowCircle = document.getElementById('ledGlowCircle');

        // Calculate conduction angle from dimming percentage
        function getConductionAngle(percent) {
            return (percent / 100) * 180;
        }

        // Convert degrees to X position (for 2 cycles = 720°)
        function degreesToX(deg) {
            return config.scopeStartX + (deg / config.totalDegrees) * config.scopeWidth;
        }

        // Generate AC sine wave path (2 cycles)
        function generateAcWave() {
            let path = `M ${config.scopeStartX} ${config.acCenterY}`;
            for (let x = 0; x <= config.scopeWidth; x++) {
                const deg = (x / config.scopeWidth) * config.totalDegrees;
                const rad = (deg * Math.PI) / 180;
                const y = config.acCenterY - Math.sin(rad) * config.acAmplitude;
                path += ` L ${config.scopeStartX + x} ${y}`;
            }
            return path;
        }

        // Generate gate signal path for 2 cycles
        function generateGatePath(isUpper, conductionAngle) {
            const baseY = isUpper ? config.upperGateY : config.lowerGateY;
            const highY = baseY - config.gateAmplitude;
            const lowY = baseY;
            const deadTime = config.deadTimeDegrees;

            let path = `M ${config.scopeStartX} ${lowY}`;

            // Generate for 2 cycles (0-720°)
            for (let cycle = 0; cycle < 2; cycle++) {
                const cycleOffset = cycle * 360;

                if (isUpper) {
                    // Upper gate: active during positive half (0-180° of each cycle)
                    if (conductionAngle > 0) {
                        const turnOnDeg = cycleOffset + deadTime;
                        const turnOffDeg = cycleOffset + conductionAngle;

                        path += ` L ${degreesToX(turnOnDeg)} ${lowY}`;
                        path += ` L ${degreesToX(turnOnDeg)} ${highY}`;
                        path += ` L ${degreesToX(turnOffDeg)} ${highY}`;
                        path += ` L ${degreesToX(turnOffDeg)} ${lowY}`;
                    }
                    path += ` L ${degreesToX(cycleOffset + 180)} ${lowY}`;

                    // Stay low during negative half
                    path += ` L ${degreesToX(cycleOffset + 360)} ${lowY}`;
                } else {
                    // Lower gate: active during negative half (180-360° of each cycle)
                    path += ` L ${degreesToX(cycleOffset + 180)} ${lowY}`;

                    if (conductionAngle > 0) {
                        const turnOnDeg = cycleOffset + 180 + deadTime;
                        const turnOffDeg = cycleOffset + 180 + conductionAngle;

                        path += ` L ${degreesToX(turnOnDeg)} ${lowY}`;
                        path += ` L ${degreesToX(turnOnDeg)} ${highY}`;
                        path += ` L ${degreesToX(turnOffDeg)} ${highY}`;
                        path += ` L ${degreesToX(turnOffDeg)} ${lowY}`;
                    }
                    path += ` L ${degreesToX(cycleOffset + 360)} ${lowY}`;
                }
            }

            return path;
        }

        // Update dead time markers on scope (for 2 cycles)
        function updateDeadTimeMarkers() {
            const deadTimeWidth = (config.deadTimeDegrees / config.totalDegrees) * config.scopeWidth;
            let markers = '';

            // Dead time markers at 0°, 180°, 360°, 540°
            const deadTimePositions = [0, 180, 360, 540];
            deadTimePositions.forEach(deg => {
                const x = degreesToX(deg);
                markers += `<rect x="${x}" y="10" width="${deadTimeWidth}" height="230" fill="#ff4444" opacity="0.1"/>`;
            });

            deadTimeMarkers.innerHTML = markers;
        }

        // Update oscilloscope display
        function updateScope() {
            const conductionAngle = getConductionAngle(dimmingPercent);

            acWave.setAttribute('d', generateAcWave());
            upperGate.setAttribute('d', generateGatePath(true, conductionAngle));
            lowerGate.setAttribute('d', generateGatePath(false, conductionAngle));
            updateDeadTimeMarkers();

            angleText.textContent = `導通角: ${conductionAngle.toFixed(0)}°`;
        }

        // Update circuit state based on animation phase
        function updateCircuitState(phase) {
            const conductionAngle = getConductionAngle(dimmingPercent);
            const deadTime = config.deadTimeDegrees;

            let upperOn = false;
            let lowerOn = false;
            let inDeadTime = false;
            let phaseLabel = '';
            let ledOn = false;

            // Normalize phase to 0-360 (single cycle)
            const normalizedPhase = ((phase % 360) + 360) % 360;

            if (normalizedPhase < 180) {
                // Positive half cycle
                if (normalizedPhase < deadTime) {
                    inDeadTime = true;
                    phaseLabel = '正半週 (Dead Time)';
                } else if (normalizedPhase < conductionAngle) {
                    upperOn = true;
                    ledOn = true;
                    phaseLabel = '正半週 (Q1 ON)';
                } else {
                    phaseLabel = '正半週 (關斷)';
                }
            } else {
                // Negative half cycle
                const negPhase = normalizedPhase - 180;
                if (negPhase < deadTime) {
                    inDeadTime = true;
                    phaseLabel = '負半週 (Dead Time)';
                } else if (negPhase < conductionAngle) {
                    lowerOn = true;
                    ledOn = true;
                    phaseLabel = '負半週 (Q2 ON)';
                } else {
                    phaseLabel = '負半週 (關斷)';
                }
            }

            // Update MOS visual state
            mosUpper.classList.toggle('mos-on', upperOn);
            mosUpper.classList.toggle('mos-off', !upperOn);
            mosLower.classList.toggle('mos-on', lowerOn);
            mosLower.classList.toggle('mos-off', !lowerOn);

            // Update status indicators
            upperStatus.classList.toggle('on', upperOn);
            lowerStatus.classList.toggle('on', lowerOn);
            deadTimeStatus.style.opacity = inDeadTime ? '1' : '0.3';
            deadTimeIndicator.setAttribute('opacity', inDeadTime ? '1' : '0');

            // Update current flow
            currentPositive.classList.toggle('active', upperOn);
            currentPositive.classList.toggle('flow-forward', upperOn);
            currentNegative.classList.toggle('active', lowerOn);
            currentNegative.classList.toggle('flow-backward', lowerOn);

            // Update LED glow
            ledRays.style.opacity = ledOn ? '1' : '0.3';
            ledGlowCircle.setAttribute('opacity', ledOn ? '0.3' : '0');

            // Update phase text
            phaseText.textContent = phaseLabel;

            // Update time indicator position (for 2 cycles display)
            // Map current phase (0-360) to full display width, then wrap for 2nd cycle
            const displayPhase = phase % config.totalDegrees;
            const indicatorX = config.scopeStartX + (displayPhase / config.totalDegrees) * config.scopeWidth;
            timeIndicator.setAttribute('x1', indicatorX);
            timeIndicator.setAttribute('x2', indicatorX);
        }

        // Animation loop
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            // Update phase (720 degrees for 2 cycles, but circuit state uses 360)
            animationPhase += (delta / config.animationSpeed) * 360;
            animationPhase %= config.totalDegrees; // Wrap at 720°

            updateCircuitState(animationPhase);

            animationId = requestAnimationFrame(animate);
        }

        // Event listeners
        dimmingSlider.addEventListener('input', (e) => {
            dimmingPercent = parseInt(e.target.value);
            dimmingValueDisplay.textContent = dimmingPercent;
            updateScope();
        });

        // Initialize
        function init() {
            updateScope();
            animationId = requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
