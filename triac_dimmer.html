<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIAC Trailing Edge 調光器動畫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Circuit Section */
        .circuit-section {
            background: #0f0f23;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .section-title {
            color: #00d4ff;
            font-size: 14px;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 3px solid #00d4ff;
        }

        /* Control Section */
        .control-section {
            background: #1a1a3e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider-label {
            color: #aaa;
            font-size: 14px;
            white-space: nowrap;
        }

        #dimmingSlider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #333, #00d4ff);
            border-radius: 4px;
            cursor: pointer;
        }

        #dimmingSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .dimming-value {
            background: #0f0f23;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
            min-width: 100px;
            text-align: center;
        }

        /* Oscilloscope Section */
        .scope-section {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #333;
        }

        .scope-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .scope-title {
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
        }

        .channel-legend {
            display: flex;
            gap: 20px;
            font-size: 12px;
            font-family: monospace;
        }

        .channel {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .channel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .ch1 .channel-dot { background: #ffff00; }
        .ch2 .channel-dot { background: #00ff00; }
        .ch3 .channel-dot { background: #00bfff; }

        /* Status indicators */
        .status-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
            padding: 10px;
            background: #0f0f23;
            border-radius: 8px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            transition: background 0.1s;
        }

        .mos-upper-indicator { background: #666; }
        .mos-lower-indicator { background: #666; }
        .mos-upper-indicator.on { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .mos-lower-indicator.on { background: #00ff00; box-shadow: 0 0 8px #00ff00; }

        /* Current flow animation */
        @keyframes flowRight {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes flowLeft {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 20; }
        }

        .current-flow {
            stroke-dasharray: 8, 4;
            stroke-width: 3;
            fill: none;
            stroke: #00bfff;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .current-flow.active {
            opacity: 1;
        }

        .current-flow.flow-positive {
            animation: flowRight 0.5s linear infinite;
        }

        .current-flow.flow-negative {
            animation: flowLeft 0.5s linear infinite;
        }

        /* MOS styling */
        .mos-body {
            transition: fill 0.15s;
        }

        .mos-on .mos-body {
            fill: #00cc00;
        }

        .mos-off .mos-body {
            fill: #555;
        }
    </style>
</head>
<body>
    <h1>TRIAC Trailing Edge 調光器</h1>

    <div class="container">
        <!-- Circuit Diagram Section -->
        <div class="circuit-section">
            <div class="section-title">電路圖 - AC → TRIAC (上下橋 MOS) → LED</div>
            <svg id="circuitSvg" viewBox="0 0 800 280" width="100%" height="280">
                <defs>
                    <!-- Arrow marker for current flow -->
                    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <path d="M0,0 L0,6 L9,3 z" fill="#00bfff"/>
                    </marker>
                    <marker id="arrowBlueReverse" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
                        <path d="M9,0 L9,6 L0,3 z" fill="#00bfff"/>
                    </marker>

                    <!-- Glow filter -->
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Background grid -->
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a3e" stroke-width="0.5"/>
                </pattern>
                <rect width="800" height="280" fill="url(#grid)"/>

                <!-- AC Source -->
                <g transform="translate(50, 100)">
                    <circle cx="40" cy="40" r="35" fill="none" stroke="#ffaa00" stroke-width="2"/>
                    <text x="40" y="45" text-anchor="middle" fill="#ffaa00" font-size="14">AC</text>
                    <path d="M25,40 Q33,25 40,40 Q47,55 55,40" fill="none" stroke="#ffaa00" stroke-width="2"/>
                    <text x="40" y="95" text-anchor="middle" fill="#888" font-size="11">110V/220V</text>
                </g>

                <!-- Connection lines - AC to Upper MOS -->
                <line x1="125" y1="120" x2="200" y2="120" stroke="#666" stroke-width="2"/>
                <line x1="200" y1="120" x2="200" y2="60" stroke="#666" stroke-width="2"/>
                <line x1="200" y1="60" x2="280" y2="60" stroke="#666" stroke-width="2"/>

                <!-- Upper MOS (Q1) -->
                <g id="mosUpper" class="mos-off" transform="translate(280, 30)">
                    <rect class="mos-body" x="0" y="0" width="60" height="60" rx="5" stroke="#888" stroke-width="2"/>
                    <text x="30" y="35" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Q1</text>
                    <text x="30" y="50" text-anchor="middle" fill="#fff" font-size="10">上橋</text>
                    <!-- Gate -->
                    <line x1="-15" y1="30" x2="0" y2="30" stroke="#00ff00" stroke-width="2"/>
                    <text x="-20" y="34" text-anchor="end" fill="#00ff00" font-size="10">G</text>
                    <!-- Drain -->
                    <line x1="30" y1="0" x2="30" y2="-15" stroke="#666" stroke-width="2"/>
                    <text x="30" y="-20" text-anchor="middle" fill="#888" font-size="10">D</text>
                    <!-- Source -->
                    <line x1="30" y1="60" x2="30" y2="75" stroke="#666" stroke-width="2"/>
                    <text x="45" y="70" fill="#888" font-size="10">S</text>
                </g>

                <!-- Connection - Upper MOS to node -->
                <line x1="310" y1="105" x2="310" y2="140" stroke="#666" stroke-width="2"/>

                <!-- Center node -->
                <circle cx="310" cy="140" r="5" fill="#00d4ff"/>

                <!-- Connection - node to Lower MOS -->
                <line x1="310" y1="145" x2="310" y2="170" stroke="#666" stroke-width="2"/>

                <!-- Lower MOS (Q2) -->
                <g id="mosLower" class="mos-off" transform="translate(280, 170)">
                    <rect class="mos-body" x="0" y="0" width="60" height="60" rx="5" stroke="#888" stroke-width="2"/>
                    <text x="30" y="35" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Q2</text>
                    <text x="30" y="50" text-anchor="middle" fill="#fff" font-size="10">下橋</text>
                    <!-- Gate -->
                    <line x1="-15" y1="30" x2="0" y2="30" stroke="#00bfff" stroke-width="2"/>
                    <text x="-20" y="34" text-anchor="end" fill="#00bfff" font-size="10">G</text>
                    <!-- Drain -->
                    <text x="45" y="5" fill="#888" font-size="10">D</text>
                    <!-- Source -->
                    <line x1="30" y1="60" x2="30" y2="75" stroke="#666" stroke-width="2"/>
                    <text x="45" y="70" fill="#888" font-size="10">S</text>
                </g>

                <!-- Connection - Lower MOS to GND return -->
                <line x1="310" y1="245" x2="310" y2="260" stroke="#666" stroke-width="2"/>
                <line x1="310" y1="260" x2="200" y2="260" stroke="#666" stroke-width="2"/>
                <line x1="200" y1="260" x2="200" y2="160" stroke="#666" stroke-width="2"/>
                <line x1="200" y1="160" x2="125" y2="160" stroke="#666" stroke-width="2"/>

                <!-- Connection - node to LED -->
                <line x1="315" y1="140" x2="450" y2="140" stroke="#666" stroke-width="2"/>

                <!-- LED Symbol -->
                <g transform="translate(450, 110)">
                    <polygon points="0,30 40,10 40,50" fill="none" stroke="#ff6b6b" stroke-width="2"/>
                    <line x1="40" y1="10" x2="40" y2="50" stroke="#ff6b6b" stroke-width="2"/>
                    <!-- Light rays -->
                    <line x1="50" y1="15" x2="65" y2="5" stroke="#ff6b6b" stroke-width="1.5"/>
                    <line x1="50" y1="25" x2="70" y2="20" stroke="#ff6b6b" stroke-width="1.5"/>
                    <!-- Arrow heads -->
                    <polygon points="65,5 60,10 62,3" fill="#ff6b6b"/>
                    <polygon points="70,20 64,22 67,15" fill="#ff6b6b"/>
                    <text x="20" y="75" text-anchor="middle" fill="#ff6b6b" font-size="12">LED</text>
                </g>

                <!-- Connection - LED to GND return -->
                <line x1="490" y1="140" x2="550" y2="140" stroke="#666" stroke-width="2"/>
                <line x1="550" y1="140" x2="550" y2="260" stroke="#666" stroke-width="2"/>
                <line x1="550" y1="260" x2="310" y2="260" stroke="#666" stroke-width="2"/>

                <!-- Current flow paths -->
                <!-- Positive half cycle path (AC+ → Q1 → LED → return) -->
                <path id="currentPathPositive" class="current-flow"
                      d="M125,120 L200,120 L200,60 L280,60 L310,60 L310,15 L310,105 L310,140 L450,140 L490,140 L550,140 L550,260 L200,260 L200,160 L125,160"
                      marker-mid="url(#arrowBlue)"/>

                <!-- Simplified positive current indicators -->
                <g id="currentPositive" class="current-flow">
                    <path d="M130,120 L195,120" marker-end="url(#arrowBlue)"/>
                    <path d="M200,115 L200,65" marker-end="url(#arrowBlue)"/>
                    <path d="M205,60 L275,60" marker-end="url(#arrowBlue)"/>
                    <path d="M310,90 L310,135" marker-end="url(#arrowBlue)"/>
                    <path d="M320,140 L445,140" marker-end="url(#arrowBlue)"/>
                    <path d="M495,140 L545,140" marker-end="url(#arrowBlue)"/>
                    <path d="M550,145 L550,255" marker-end="url(#arrowBlue)"/>
                    <path d="M545,260 L315,260" marker-end="url(#arrowBlue)"/>
                    <path d="M305,260 L205,260" marker-end="url(#arrowBlue)"/>
                    <path d="M200,255 L200,165" marker-end="url(#arrowBlue)"/>
                    <path d="M195,160 L130,160" marker-end="url(#arrowBlue)"/>
                </g>

                <!-- Negative half cycle path (AC- → Q2 → LED → return) -->
                <g id="currentNegative" class="current-flow">
                    <path d="M130,160 L195,160" marker-end="url(#arrowBlue)"/>
                    <path d="M200,165 L200,255" marker-end="url(#arrowBlue)"/>
                    <path d="M205,260 L305,260" marker-end="url(#arrowBlue)"/>
                    <path d="M310,255 L310,245" marker-end="url(#arrowBlue)"/>
                    <path d="M310,230 L310,175" marker-end="url(#arrowBlue)"/>
                    <path d="M310,165 L310,145" marker-end="url(#arrowBlue)"/>
                    <path d="M445,140 L320,140" marker-end="url(#arrowBlue)"/>
                    <path d="M545,140 L495,140" marker-end="url(#arrowBlue)"/>
                    <path d="M550,255 L550,145" marker-end="url(#arrowBlue)"/>
                    <path d="M315,260 L545,260" marker-end="url(#arrowBlue)"/>
                </g>

                <!-- Dead Time indicator -->
                <g id="deadTimeIndicator" transform="translate(620, 80)" opacity="0">
                    <rect x="0" y="0" width="120" height="50" rx="5" fill="#ff4444" fill-opacity="0.2" stroke="#ff4444" stroke-width="1"/>
                    <text x="60" y="20" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="bold">DEAD TIME</text>
                    <text x="60" y="38" text-anchor="middle" fill="#ff8888" font-size="10">兩橋皆 OFF</text>
                </g>

                <!-- Phase indicator -->
                <g transform="translate(620, 20)">
                    <text x="60" y="15" text-anchor="middle" fill="#888" font-size="11">當前相位</text>
                    <text id="phaseText" x="60" y="40" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">--</text>
                </g>

                <!-- Conduction angle display -->
                <g transform="translate(620, 150)">
                    <text x="60" y="15" text-anchor="middle" fill="#888" font-size="11">導通角</text>
                    <text id="angleText" x="60" y="40" text-anchor="middle" fill="#ffaa00" font-size="14" font-weight="bold">0°</text>
                </g>
            </svg>
        </div>

        <!-- Control Section -->
        <div class="control-section">
            <div class="slider-container">
                <span class="slider-label">調光控制 (Trailing Edge)</span>
                <input type="range" id="dimmingSlider" min="0" max="100" value="50">
            </div>
            <div class="dimming-value"><span id="dimmingValue">50</span>%</div>
        </div>

        <!-- Status Panel -->
        <div class="status-panel">
            <div class="status-item">
                <div class="status-indicator mos-upper-indicator" id="upperStatus"></div>
                <span>上橋 Q1</span>
            </div>
            <div class="status-item">
                <div class="status-indicator mos-lower-indicator" id="lowerStatus"></div>
                <span>下橋 Q2</span>
            </div>
            <div class="status-item" style="color: #ff4444;">
                <span id="deadTimeStatus" style="opacity: 0.3;">● Dead Time</span>
            </div>
        </div>

        <!-- Oscilloscope Section -->
        <div class="scope-section">
            <div class="scope-header">
                <div class="scope-title">▶ OSCILLOSCOPE - 示波器顯示</div>
                <div class="channel-legend">
                    <div class="channel ch1"><div class="channel-dot"></div>CH1: AC Input</div>
                    <div class="channel ch2"><div class="channel-dot"></div>CH2: Q1 Gate</div>
                    <div class="channel ch3"><div class="channel-dot"></div>CH3: Q2 Gate</div>
                </div>
            </div>
            <svg id="scopeSvg" viewBox="0 0 800 250" width="100%" height="250">
                <!-- Scope background -->
                <rect width="800" height="250" fill="#0a0a0a"/>

                <!-- Grid -->
                <defs>
                    <pattern id="scopeGrid" width="50" height="50" patternUnits="userSpaceOnUse">
                        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1a3a1a" stroke-width="0.5"/>
                    </pattern>
                    <pattern id="scopeGridMinor" width="10" height="10" patternUnits="userSpaceOnUse">
                        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0d1f0d" stroke-width="0.3"/>
                    </pattern>
                </defs>
                <rect x="50" y="10" width="700" height="230" fill="url(#scopeGridMinor)"/>
                <rect x="50" y="10" width="700" height="230" fill="url(#scopeGrid)"/>

                <!-- Scope border -->
                <rect x="50" y="10" width="700" height="230" fill="none" stroke="#2a4a2a" stroke-width="2"/>

                <!-- Center lines -->
                <line x1="50" y1="70" x2="750" y2="70" stroke="#2a4a2a" stroke-width="1" stroke-dasharray="5,5"/>
                <line x1="50" y1="125" x2="750" y2="125" stroke="#2a4a2a" stroke-width="1"/>
                <line x1="50" y1="165" x2="750" y2="165" stroke="#2a4a2a" stroke-width="1" stroke-dasharray="5,5"/>
                <line x1="50" y1="200" x2="750" y2="200" stroke="#2a4a2a" stroke-width="1" stroke-dasharray="5,5"/>

                <!-- Y-axis labels -->
                <text x="45" y="75" text-anchor="end" fill="#888" font-size="10">CH1</text>
                <text x="45" y="170" text-anchor="end" fill="#888" font-size="10">CH2</text>
                <text x="45" y="205" text-anchor="end" fill="#888" font-size="10">CH3</text>

                <!-- Time markers -->
                <text x="50" y="248" fill="#666" font-size="9">0°</text>
                <text x="225" y="248" fill="#666" font-size="9">90°</text>
                <text x="400" y="248" fill="#666" font-size="9">180°</text>
                <text x="575" y="248" fill="#666" font-size="9">270°</text>
                <text x="740" y="248" fill="#666" font-size="9">360°</text>

                <!-- AC Sine wave (CH1 - Yellow) -->
                <path id="acWave" d="" fill="none" stroke="#ffff00" stroke-width="2"/>

                <!-- Upper gate signal (CH2 - Green) -->
                <path id="upperGate" d="" fill="none" stroke="#00ff00" stroke-width="2"/>

                <!-- Lower gate signal (CH3 - Blue) -->
                <path id="lowerGate" d="" fill="none" stroke="#00bfff" stroke-width="2"/>

                <!-- Time indicator (red vertical line) -->
                <line id="timeIndicator" x1="50" y1="10" x2="50" y2="240" stroke="#ff0000" stroke-width="2" opacity="0.8"/>

                <!-- Dead time markers -->
                <g id="deadTimeMarkers"></g>
            </svg>
        </div>
    </div>

    <script>
        // Configuration
        const config = {
            scopeWidth: 700,
            scopeStartX: 50,
            scopeEndX: 750,
            acCenterY: 70,
            acAmplitude: 45,
            upperGateY: 165,
            lowerGateY: 200,
            gateAmplitude: 20,
            deadTimeDegrees: 5, // Dead time in degrees
            animationSpeed: 2000 // ms for one full cycle
        };

        // State
        let dimmingPercent = 50;
        let animationPhase = 0;
        let animationId = null;
        let lastTimestamp = 0;

        // DOM Elements
        const dimmingSlider = document.getElementById('dimmingSlider');
        const dimmingValueDisplay = document.getElementById('dimmingValue');
        const mosUpper = document.getElementById('mosUpper');
        const mosLower = document.getElementById('mosLower');
        const currentPositive = document.getElementById('currentPositive');
        const currentNegative = document.getElementById('currentNegative');
        const upperStatus = document.getElementById('upperStatus');
        const lowerStatus = document.getElementById('lowerStatus');
        const deadTimeStatus = document.getElementById('deadTimeStatus');
        const deadTimeIndicator = document.getElementById('deadTimeIndicator');
        const phaseText = document.getElementById('phaseText');
        const angleText = document.getElementById('angleText');
        const timeIndicator = document.getElementById('timeIndicator');
        const acWave = document.getElementById('acWave');
        const upperGate = document.getElementById('upperGate');
        const lowerGate = document.getElementById('lowerGate');
        const deadTimeMarkers = document.getElementById('deadTimeMarkers');

        // Calculate conduction angle from dimming percentage
        // Trailing edge: higher % = more conduction = earlier turn-off point
        function getConductionAngle(percent) {
            // 0% = 0° conduction, 100% = 180° conduction per half cycle
            return (percent / 100) * 180;
        }

        // Generate AC sine wave path
        function generateAcWave() {
            let path = `M ${config.scopeStartX} ${config.acCenterY}`;
            for (let x = 0; x <= config.scopeWidth; x++) {
                const phase = (x / config.scopeWidth) * 2 * Math.PI;
                const y = config.acCenterY - Math.sin(phase) * config.acAmplitude;
                path += ` L ${config.scopeStartX + x} ${y}`;
            }
            return path;
        }

        // Generate gate signal path (trailing edge)
        function generateGatePath(isUpper, conductionAngle) {
            const baseY = isUpper ? config.upperGateY : config.lowerGateY;
            const highY = baseY - config.gateAmplitude;
            const lowY = baseY;

            // Convert degrees to x position
            const degreesToX = (deg) => config.scopeStartX + (deg / 360) * config.scopeWidth;

            const deadTimeX = (config.deadTimeDegrees / 360) * config.scopeWidth;
            const conductionX = (conductionAngle / 180) * (config.scopeWidth / 2);

            let path = `M ${config.scopeStartX} ${lowY}`;

            if (isUpper) {
                // Positive half: 0° to 180°
                // Turn on after dead time, turn off at conduction angle (trailing edge)
                if (conductionAngle > 0) {
                    const turnOnX = config.scopeStartX + deadTimeX;
                    const turnOffX = config.scopeStartX + conductionX;

                    path += ` L ${turnOnX} ${lowY}`;
                    path += ` L ${turnOnX} ${highY}`;
                    path += ` L ${turnOffX} ${highY}`;
                    path += ` L ${turnOffX} ${lowY}`;
                }
                path += ` L ${config.scopeStartX + config.scopeWidth/2} ${lowY}`;
                path += ` L ${config.scopeEndX} ${lowY}`;
            } else {
                // Negative half: 180° to 360°
                path += ` L ${config.scopeStartX + config.scopeWidth/2} ${lowY}`;

                if (conductionAngle > 0) {
                    const turnOnX = config.scopeStartX + config.scopeWidth/2 + deadTimeX;
                    const turnOffX = config.scopeStartX + config.scopeWidth/2 + conductionX;

                    path += ` L ${turnOnX} ${lowY}`;
                    path += ` L ${turnOnX} ${highY}`;
                    path += ` L ${turnOffX} ${highY}`;
                    path += ` L ${turnOffX} ${lowY}`;
                }
                path += ` L ${config.scopeEndX} ${lowY}`;
            }

            return path;
        }

        // Update dead time markers on scope
        function updateDeadTimeMarkers(conductionAngle) {
            const deadTimeX = (config.deadTimeDegrees / 360) * config.scopeWidth;
            const halfWidth = config.scopeWidth / 2;

            let markers = '';

            // Dead time at 0° (start of positive half)
            markers += `<rect x="${config.scopeStartX}" y="10" width="${deadTimeX}" height="230" fill="#ff4444" opacity="0.15"/>`;

            // Dead time at 180° (start of negative half)
            markers += `<rect x="${config.scopeStartX + halfWidth}" y="10" width="${deadTimeX}" height="230" fill="#ff4444" opacity="0.15"/>`;

            deadTimeMarkers.innerHTML = markers;
        }

        // Update oscilloscope display
        function updateScope() {
            const conductionAngle = getConductionAngle(dimmingPercent);

            acWave.setAttribute('d', generateAcWave());
            upperGate.setAttribute('d', generateGatePath(true, conductionAngle));
            lowerGate.setAttribute('d', generateGatePath(false, conductionAngle));
            updateDeadTimeMarkers(conductionAngle);

            angleText.textContent = `${conductionAngle.toFixed(0)}°`;
        }

        // Update circuit state based on animation phase
        function updateCircuitState(phase) {
            // phase: 0 to 360 degrees
            const conductionAngle = getConductionAngle(dimmingPercent);
            const deadTime = config.deadTimeDegrees;

            let upperOn = false;
            let lowerOn = false;
            let inDeadTime = false;
            let phaseLabel = '';

            // Normalize phase to 0-360
            const normalizedPhase = ((phase % 360) + 360) % 360;

            if (normalizedPhase < 180) {
                // Positive half cycle
                if (normalizedPhase < deadTime) {
                    inDeadTime = true;
                    phaseLabel = '正半週 (Dead Time)';
                } else if (normalizedPhase < conductionAngle) {
                    upperOn = true;
                    phaseLabel = '正半週 (Q1 ON)';
                } else {
                    phaseLabel = '正半週 (關斷)';
                }
            } else {
                // Negative half cycle
                const negPhase = normalizedPhase - 180;
                if (negPhase < deadTime) {
                    inDeadTime = true;
                    phaseLabel = '負半週 (Dead Time)';
                } else if (negPhase < conductionAngle) {
                    lowerOn = true;
                    phaseLabel = '負半週 (Q2 ON)';
                } else {
                    phaseLabel = '負半週 (關斷)';
                }
            }

            // Update MOS visual state
            mosUpper.classList.toggle('mos-on', upperOn);
            mosUpper.classList.toggle('mos-off', !upperOn);
            mosLower.classList.toggle('mos-on', lowerOn);
            mosLower.classList.toggle('mos-off', !lowerOn);

            // Update status indicators
            upperStatus.classList.toggle('on', upperOn);
            lowerStatus.classList.toggle('on', lowerOn);
            deadTimeStatus.style.opacity = inDeadTime ? '1' : '0.3';
            deadTimeIndicator.setAttribute('opacity', inDeadTime ? '1' : '0');

            // Update current flow
            currentPositive.classList.toggle('active', upperOn);
            currentPositive.classList.toggle('flow-positive', upperOn);
            currentNegative.classList.toggle('active', lowerOn);
            currentNegative.classList.toggle('flow-negative', lowerOn);

            // Update phase text
            phaseText.textContent = phaseLabel;

            // Update time indicator position on scope
            const indicatorX = config.scopeStartX + (normalizedPhase / 360) * config.scopeWidth;
            timeIndicator.setAttribute('x1', indicatorX);
            timeIndicator.setAttribute('x2', indicatorX);
        }

        // Animation loop
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            // Update phase (360 degrees per cycle)
            animationPhase += (delta / config.animationSpeed) * 360;
            animationPhase %= 360;

            updateCircuitState(animationPhase);

            animationId = requestAnimationFrame(animate);
        }

        // Event listeners
        dimmingSlider.addEventListener('input', (e) => {
            dimmingPercent = parseInt(e.target.value);
            dimmingValueDisplay.textContent = dimmingPercent;
            updateScope();
        });

        // Initialize
        function init() {
            updateScope();
            animationId = requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
